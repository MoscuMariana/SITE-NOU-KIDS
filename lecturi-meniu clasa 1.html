<html lang="ro">
<head>
<meta charset="UTF-8">

<title>Lecturi Clasa 1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Arial', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #ffd6e0 0%, #c5e8ff 100%);
    min-height: 100vh;
    padding: 15px;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  }
  h1 {
    text-align: center;
    color: #d63384;
    font-size: 1.8em;
    margin-bottom: 10px;
  }
  .subtitle {
    text-align: center;
    color: #555;
    font-size: 1.1em;
    margin-bottom: 20px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .menu-item {
    background: linear-gradient(135deg, #fff9e6, #ffe5b4);
    border: 3px solid #ffc107;
    border-radius: 15px;
    padding: 15px 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: inherit;
    font-weight: bold;
  }
  .menu-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    background: linear-gradient(135deg, #ffe5b4, #ffd591);
  }
  .menu-item.completed {
    background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
    border-color: #4caf50;
  }
  .menu-num {
    font-size: 1em;
    color: #d84315;
    margin-bottom: 5px;
    letter-spacing: 1px;
  }
  .menu-emoji {
    font-size: 2em;
    margin: 5px 0;
  }
  .menu-title {
    font-size: 0.95em;
    color: #333;
    letter-spacing: 1px;
  }
  .menu-check {
    color: #2e7d32;
    font-size: 1.2em;
    margin-top: 5px;
  }
  .back-btn {
    background: #ffab91;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 15px;
    letter-spacing: 1px;
  }
  .progress {
    text-align: center;
    background: #fff3cd;
    padding: 8px;
    border-radius: 12px;
    margin: 15px 0;
    font-size: 1em;
    color: #856404;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .text-card {
    background: #fff9e6;
    border: 3px solid #ffc107;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .text-title {
    color: #d84315;
    font-size: 1.4em;
    margin-bottom: 12px;
    text-align: center;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .text-content {
    font-size: 1.4em;
    line-height: 1.9;
    background: white;
    padding: 18px;
    border-radius: 10px;
    border-left: 5px solid #ff9800;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: #222;
  }
  .question {
    background: #e3f2fd;
    border-radius: 12px;
    padding: 12px;
    margin: 12px 0;
  }
  .question-text {
    font-weight: bold;
    color: #1565c0;
    margin-bottom: 10px;
    font-size: 1.15em;
    letter-spacing: 1px;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    background: white;
    border: 2px solid #90caf9;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    font-size: 1.1em;
    text-align: left;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 1px;
    color: #222;
  }
  .option:hover:not(:disabled) { background: #bbdefb; }
  .option.correct { background: #c8e6c9; border-color: #4caf50; }
  .option.wrong { background: #ffcdd2; border-color: #f44336; }
  .option:disabled { cursor: not-allowed; }
  .feedback {
    margin-top: 8px;
    padding: 8px;
    border-radius: 8px;
    font-weight: bold;
    text-align: center;
    display: none;
    letter-spacing: 1px;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #c8e6c9; color: #1b5e20; }
  .feedback.wrong { background: #ffcdd2; color: #b71c1c; }
  .nav { display: flex; gap: 10px; margin-top: 15px; }
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1.05em;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    color: white;
    letter-spacing: 1px;
  }
  .btn-prev { background: #ffab91; }
  .btn-next { background: #66bb6a; }
  .btn-menu { background: #9c27b0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .score {
    background: linear-gradient(135deg, #66bb6a, #43a047);
    color: white;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    margin-top: 15px;
    font-size: 1.1em;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .footer {
    text-align: center;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px dashed #ffc107;
    color: #666;
    font-size: 0.95em;
  }
  .footer a {
    color: #d63384;
    font-weight: bold;
    text-decoration: none;
  }
</style>
</head>

let cur = 0, sc = 0;
let ans = {}; // {0: [true, false, true], 1: [...], ...}
let completed = {}; // {0: true, ...}

function showMenu(){
  let totalScore = 0, totalQ = 0;
  Object.keys(ans).forEach(k=>{
    ans[k].forEach(v=>{ totalQ++; if(v) totalScore++; });
  });
  
  let h = `<p class="subtitle">ALEGE O LECTURĂ PENTRU A ÎNCEPE</p>`;
  h += `<div class="score">⭐ SCOR TOTAL: ${totalScore} / ${L.length*3}</div>`;
  h += `<div class="menu-grid">`;
  L.forEach((l,i)=>{
    const isDone = completed[i];
    h += `<button class="menu-item ${isDone?'completed':''}" onclick="startLesson(${i})">
      <div class="menu-num">LECTURA ${i+1}</div>
      <div class="menu-emoji">${l.e}</div>
      <div class="menu-title">${l.t}</div>
      ${isDone?'<div class="menu-check">✅ TERMINAT</div>':''}
    </button>`;
  });
  h += `</div>`;
  document.getElementById('content').innerHTML = h;
}

function startLesson(i){
  cur = i;
  if(!ans[cur]) ans[cur] = [];
  render();
}

function render(){
  const l = L[cur];
  let h = `<button class="back-btn" onclick="showMenu()">🏠 MENIU PRINCIPAL</button>`;
  h += `<div class="progress">LECTURA ${cur+1} DIN ${L.length}</div>`;
  h += `<div class="text-card"><div class="text-title">${l.e} ${l.t}</div><div class="text-content">${l.x}</div></div>`;
  
  l.q.forEach((q,qi)=>{
    const done = ans[cur] && ans[cur][qi] !== undefined;
    h += `<div class="question"><div class="question-text">${qi+1}. ${q.q}</div><div class="options">`;
    q.o.forEach((opt,oi)=>{
      let cls = 'option';
      if(done){
        if(oi === q.c) cls += ' correct';
        else if(ans[cur][qi] === false && oi === ans[cur][qi+'_choice']) cls += ' wrong';
      }
      h += `<button class="${cls}" id="o-${qi}-${oi}" onclick="check(${qi},${oi})" ${done?'disabled':''}>${opt}</button>`;
    });
    h += `</div><div class="feedback ${done?'show '+(ans[cur][qi]?'correct':'wrong'):''}" id="f-${qi}">${done?(ans[cur][qi]?'✅ BRAVO! RĂSPUNS CORECT!':'❌ RĂSPUNSUL CORECT ESTE CEL VERDE.'):''}</div></div>`;
  });
  
  h += `<div class="nav">`;
  h += `<button class="btn btn-prev" ${cur===0?'disabled':''} onclick="prev()">⬅ ÎNAPOI</button>`;
  h += `<button class="btn btn-menu" onclick="showMenu()">🏠 MENIU</button>`;
  h += `<button class="btn btn-next" ${cur===L.length-1?'disabled':''} onclick="next()">ÎNAINTE ➡</button>`;
  h += `</div>`;
  
  document.getElementById('content').innerHTML = h;
  window.scrollTo(0,0);
}

function check(qi,oi){
  if(ans[cur][qi] !== undefined) return;
  const c = L[cur].q[qi].c;
  const correct = oi === c;
  ans[cur][qi] = correct;
  ans[cur][qi+'_choice'] = oi;
  
  // Check if all questions answered
  let allDone = true;
  for(let i=0;i<L[cur].q.length;i++){
    if(ans[cur][i] === undefined) allDone = false;
  }
  if(allDone) completed[cur] = true;
  
  const fb = document.getElementById(`f-${qi}`);
  for(let i=0;i<L[cur].q[qi].o.length;i++){
    const b = document.getElementById(`o-${qi}-${i}`);
    b.disabled = true;
    if(i===c) b.classList.add('correct');
    else if(i===oi) b.classList.add('wrong');
  }
  if(correct){ fb.textContent='✅ BRAVO! RĂSPUNS CORECT!'; fb.className='feedback show correct'; }
  else { fb.textContent='❌ RĂSPUNSUL CORECT ESTE CEL VERDE.'; fb.className='feedback show wrong'; }
}

function next(){ if(cur<L.length-1){ cur++; if(!ans[cur]) ans[cur]=[]; render(); } }
function prev(){ if(cur>0){ cur--; if(!ans[cur]) ans[cur]=[]; render(); } }

showMenu();
</script>
