<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trenulețul interactiv – KIDDY MSK</title>
<meta name="google-adsense-account" content="ca-pub-1336256146659551">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1336256146659551"
   crossorigin="anonymous"></script>
<style>
  :root{
    --rosu:#e63329;--galben:#f5c518;--negru:#1a1a1a;--verde:#2fae5a;--albastru:#2f6fed;--mov:#8a4fd0;
    --wagon:70px;             /* dimensiunea vagonului, ajustată de JS pe ecran */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Comic Sans MS","Segoe UI",sans-serif;color:var(--negru);
    background:linear-gradient(#bfe9ff 0%,#d9f4ff 16%,#e7f8ef 30%,#bfe79a 46%,#9ed470 74%,#8fce5f 100%);
    min-height:100%;overflow-x:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;
  }
  /* nori decorativi */
  .cloud{position:fixed;top:0;left:0;pointer-events:none;opacity:.85;z-index:0;}
  .cloud b{position:absolute;background:#fff;border-radius:50%;filter:blur(.3px);}

  /* ---------- BARA DE SUS ---------- */
  .toolbar{
    position:relative;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(4px);
    box-shadow:0 4px 16px rgba(0,0,0,.12);border-bottom:4px solid var(--galben);
    display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 14px;
  }
  .brand{display:flex;align-items:center;gap:9px;margin-right:auto;}
  .brand img{width:42px;height:42px;object-fit:contain;}
  .brand h1{font-size:19px;color:var(--albastru);letter-spacing:.5px;line-height:1;}
  .brand small{display:block;font-size:11px;color:#e05a9a;font-weight:bold;}
  .sel{display:inline-flex;align-items:center;gap:6px;font-weight:bold;font-size:13px;color:#333;}
  .sel select{font-family:inherit;font-size:14px;font-weight:bold;color:var(--albastru);
    padding:8px 10px;border:2.5px solid var(--galben);border-radius:999px;background:#fffdf5;cursor:pointer;}
  .btn{border:none;border-radius:999px;padding:10px 16px;font-size:14px;font-weight:bold;cursor:pointer;
    font-family:inherit;transition:transform .1s;color:#fff;white-space:nowrap;}
  .btn:active{transform:translateY(2px);}
  .btn-check{background:var(--verde);box-shadow:0 4px 0 #1f7d40;}
  .btn-new{background:var(--rosu);box-shadow:0 4px 0 #a8231c;}
  .btn-hint{background:var(--mov);box-shadow:0 4px 0 #5f2fa0;}
  .btn-ghost{background:var(--albastru);box-shadow:0 4px 0 #1d4fb0;}
  .btn-full{background:#37474f;box-shadow:0 4px 0 #1f2a30;}

  /* ---------- ZONA DE JOC ---------- */
  .stage{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:center;
    gap:clamp(10px,2.2vh,26px);padding:clamp(10px,2vh,26px) 14px;}
  .instr{text-align:center;font-size:clamp(15px,2.4vw,22px);font-weight:bold;color:#2b6a2f;
    background:rgba(255,255,255,.7);border-radius:999px;padding:7px 16px;align-self:center;max-width:960px;}
  .instr .arr{color:var(--rosu);}

  /* ȘINA + LOCOMOTIVA + VAGOANE */
  .rail-wrap{position:relative;}
  .track{display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:6px 8px;
    position:relative;padding-bottom:16px;}
  .track::before{content:"";position:absolute;left:1%;right:1%;bottom:10px;height:5px;
    background:repeating-linear-gradient(90deg,#5b3a1a 0 16px,#8a5a2a 16px 22px);border-radius:3px;z-index:0;}
  .engine{width:calc(var(--wagon) * 2);flex:0 0 auto;position:relative;z-index:2;align-self:flex-end;margin-bottom:-4px;
    animation:chug 1.6s ease-in-out infinite;}
  .engine img{width:100%;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));}
  @keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .wagon{position:relative;z-index:2;width:var(--wagon);height:var(--wagon);background:#fff;
    border:3px solid #333;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--wagon) * .5);font-weight:bold;font-family:"Consolas","Courier New",monospace;
    color:var(--verde);flex:0 0 auto;margin:0 2px 15px;transition:transform .12s,border-color .2s,background .2s;}
  .wagon::before,.wagon::after{content:"";position:absolute;bottom:-13px;width:17px;height:17px;border-radius:50%;
    background:#333;border:3px solid #f2c94c;}
  .wagon::before{left:9px;} .wagon::after{right:9px;}
  .wagon .slot-num{font-size:calc(var(--wagon) * .16);color:#bbb;position:absolute;top:3px;left:6px;font-weight:bold;}
  .wagon.hover{border-color:var(--albastru);background:#eaf2ff;transform:translateY(-4px);}
  .wagon.filled{color:var(--negru);}
  .wagon.ok{border-color:var(--verde);background:#e5f8ec;animation:pop .35s;}
  .wagon.bad{border-color:var(--rosu);background:#ffe9e7;animation:shake .4s;}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

  /* GARAJUL DE NUMERE (pool) */
  .pool-label{text-align:center;font-size:14px;font-weight:bold;color:#555;margin-bottom:-2px;}
  .pool{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;
    background:rgba(255,255,255,.55);border:3px dashed #f0a500;border-radius:20px;
    padding:12px;min-height:calc(var(--wagon) + 18px);max-width:1100px;margin:0 auto;width:100%;}
  .pool.hover{background:rgba(255,255,255,.85);border-color:var(--albastru);}

  /* TOKENUL (numărul mutabil) */
  .token{width:var(--wagon);height:var(--wagon);border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--wagon) * .5);font-weight:bold;font-family:"Consolas","Courier New",monospace;color:#fff;
    cursor:grab;flex:0 0 auto;box-shadow:0 4px 0 rgba(0,0,0,.22),0 6px 10px rgba(0,0,0,.18);
    border:3px solid rgba(255,255,255,.65);touch-action:none;transition:transform .1s;}
  .token:active{cursor:grabbing;}
  .token.sel{outline:5px solid #fff;outline-offset:2px;transform:scale(1.08) translateY(-3px);animation:wob .5s infinite;}
  @keyframes wob{0%,100%{transform:scale(1.08) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
  .token.dragging{position:fixed;z-index:9999;pointer-events:none;margin:0;transform:scale(1.12);box-shadow:0 10px 22px rgba(0,0,0,.35);}
  .c0{background:#ff7a7a} .c1{background:#ffb14d} .c2{background:#ffd24d;color:#5a4a00!important}
  .c3{background:#7ed957;color:#123a08!important} .c4{background:#4dd0e1} .c5{background:#6ea8ff}
  .c6{background:#b98cff} .c7{background:#ff8fc7} .c8{background:#5ad1a8} .c9{background:#f28cff}

  /* FEEDBACK / SCOR */
  .hud{position:fixed;top:64px;right:12px;z-index:6;background:rgba(255,255,255,.92);border-radius:16px;
    padding:6px 12px;font-weight:bold;color:#333;box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;gap:12px;align-items:center;font-size:15px;}
  .hud .stars{color:#f5b301;letter-spacing:1px;}

  /* MESAJ BRAVO */
  .toast{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;pointer-events:none;}
  .toast.show{display:flex;}
  .toast .card{background:#fff;border:6px solid var(--galben);border-radius:28px;padding:26px 40px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .4s;}
  .toast .card .big{font-size:clamp(34px,7vw,64px);color:var(--verde);font-weight:bold;}
  .toast .card .sub{font-size:clamp(16px,3vw,22px);color:#555;margin-top:4px;}

  /* CONFETTI */
  .confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:40;pointer-events:none;border-radius:2px;}

  .foot{text-align:center;font-size:12px;color:#2b6a2f;padding:4px 0 8px;z-index:2;position:relative;}
  .foot b{color:var(--rosu);} .foot a{color:var(--albastru);text-decoration:none;}

  @media (max-width:600px){
    .brand h1{font-size:16px;} .brand small{font-size:10px;}
    .btn{padding:9px 12px;font-size:13px;} .sel select{font-size:13px;padding:7px 8px;}
    .hud{top:auto;bottom:8px;right:8px;font-size:13px;padding:5px 9px;}
  }
</style>
</head>
<body>
<div class="cloud" id="clouds"></div>

<div class="toolbar">
  <div class="brand"><img id="logo" alt="KIDDY MSK"><div><h1 id="tTitle">TRENULEȚUL</h1><small>KIDDY MSK · tablă interactivă</small></div></div>
  <label class="sel"><span id="lRange">Interval:</span><select id="selRange" onchange="setOpt('range',this.value)"></select></label>
  <label class="sel"><span id="lCount">Vagoane:</span><select id="selCount" onchange="setOpt('count',this.value)"></select></label>
  <label class="sel"><span id="lOrder">Ordine:</span><select id="selOrder" onchange="setOpt('order',this.value)"></select></label>
  <button class="btn btn-check" onclick="checkAnswer()">✅ <span id="tCheck">Verifică</span></button>
  <button class="btn btn-hint" onclick="giveHint()">💡 <span id="tHint">Ajutor</span></button>
  <button class="btn btn-new" onclick="newRound()">🚂 <span id="tNew">Tren nou</span></button>
  <button class="btn btn-full" onclick="toggleFull()">⛶</button>
  <button class="btn btn-ghost" onclick="toggleLang()">🌐 <span id="tLang">English</span></button>
</div>

<div class="hud">🏆 <span id="score">0</span> <span class="stars" id="stars"></span></div>

<div class="stage">
  <div class="instr" id="instr"></div>
  <div class="rail-wrap"><div class="track" id="track"></div></div>
  <div>
    <div class="pool-label" id="poolLabel">Trage numerele în vagoane 👇</div>
    <div class="pool" id="pool"></div>
  </div>
</div>

<div class="foot">📘 <a href="https://www.facebook.com/Kiddymsk" target="_blank"><b id="tFoot">Kiddymsk · kiddymskNOU · Clasa pregătitoare–4</b></a></div>

<div class="toast" id="toast"><div class="card"><div class="big" id="toastBig">BRAVO! 🎉</div><div class="sub" id="toastSub">Ai ordonat trenulețul!</div></div></div>

<script>
/* ---------------- TEXTE ---------------- */
const T={
  ro:{title:"TRENULEȚUL",range:"Interval:",count:"Vagoane:",order:"Ordine:",check:"Verifică",hint:"Ajutor",
     neu:"Tren nou",lang:"English",foot:"Kiddymsk · kiddymskNOU · Clasa pregătitoare–4",
     poolDrag:"Trage numerele în vagoane 👇",poolTap:"Atinge un număr, apoi vagonul 👆",
     asc:"Crescător",desc:"Descrescător",
     instrAsc:'Așază numerele în ordine <span class="arr">crescătoare</span>. Cel mai <b>mic</b> lângă locomotivă.',
     instrDesc:'Așază numerele în ordine <span class="arr">descrescătoare</span>. Cel mai <b>mare</b> lângă locomotivă.',
     bravo:"BRAVO! 🎉",bravoSub:"Ai ordonat trenulețul!",
     tryTitle:"Mai încearcă! 🙂",trySub:"Câteva vagoane nu sunt la locul lor.",
     fill:"Umple toate vagoanele mai întâi!"},
  en:{title:"THE LITTLE TRAIN",range:"Range:",count:"Wagons:",order:"Order:",check:"Check",hint:"Hint",
     neu:"New train",lang:"Română",foot:"Kiddymsk · kiddymskNOU · Preschool–Grade 4",
     poolDrag:"Drag the numbers into the wagons 👇",poolTap:"Tap a number, then a wagon 👆",
     asc:"Ascending",desc:"Descending",
     instrAsc:'Put the numbers in <span class="arr">ascending</span> order. The <b>smallest</b> next to the engine.',
     instrDesc:'Put the numbers in <span class="arr">descending</span> order. The <b>largest</b> next to the engine.',
     bravo:"WELL DONE! 🎉",bravoSub:"You sorted the little train!",
     tryTitle:"Try again! 🙂",trySub:"Some wagons are not in the right place.",
     fill:"Fill in all the wagons first!"}
};
let lang="ro";

/* ---------------- STARE ---------------- */
const RANGES={"10":10,"20":20,"30":30,"50":50,"100":100};
const RORDER=["10","20","30","50","100"];
let range="10", count=6, order="asc";
let sorted=[], score=0, stars=0;

const $=id=>document.getElementById(id);
const ri=(lo,hi)=>lo+Math.floor(Math.random()*(hi-lo+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function uniq(n,lo,hi){const s=new Set();let g=0;while(s.size<n&&g++<2000)s.add(ri(lo,hi));return[...s];}

/* logo + locomotivă */
if(typeof IMG!=="undefined") $("logo").src=IMG.logo;
function engineHTML(){
  if(typeof IMG_LOCO!=="undefined"){
    return `<div class="engine"><img src="${IMG_LOCO[ri(0,IMG_LOCO.length-1)]}" alt="locomotivă"></div>`;
  }
  return `<div class="engine"><svg viewBox="0 0 120 84">
    <circle cx="26" cy="72" r="10" fill="#333" stroke="#f2c94c" stroke-width="3"/><circle cx="60" cy="72" r="10" fill="#333" stroke="#f2c94c" stroke-width="3"/><circle cx="94" cy="72" r="12" fill="#333" stroke="#f2c94c" stroke-width="3"/>
    <rect x="62" y="30" width="48" height="42" rx="6" fill="#e8452e" stroke="#333" stroke-width="2.5"/>
    <rect x="72" y="38" width="28" height="20" rx="4" fill="#bfe9ff" stroke="#333" stroke-width="2"/>
    <rect x="14" y="46" width="52" height="26" rx="5" fill="#2f6fed" stroke="#333" stroke-width="2.5"/>
    <rect x="22" y="18" width="12" height="30" rx="3" fill="#333"/>
    <ellipse cx="28" cy="14" rx="11" ry="6" fill="#cfd8dc"/><ellipse cx="42" cy="9" rx="8" ry="5" fill="#cfd8dc"/></svg></div>`;
}

/* ---------------- RENDER ---------------- */
function sizeWagons(){
  // ajustează --wagon ca să încapă locomotiva(2u) + count vagoane pe un rând (desktop),
  // sau pe mai multe rânduri (mobil) fără să fie prea mici
  const w=window.innerWidth, per=count+2;
  let s=Math.floor((w-60)/per)-10;
  s=Math.max(46, Math.min(108, s));
  document.documentElement.style.setProperty("--wagon", s+"px");
}

function newRound(){
  const M=RANGES[range];
  const maxCount=Math.min(count, M);           // nu cere mai multe numere decât încap în interval
  const nums=uniq(maxCount,1,M);
  sorted=[...nums].sort((a,b)=>order==="asc"?a-b:b-a);
  sizeWagons();
  // vagoane goale
  $("track").innerHTML=engineHTML()+sorted.map((_,i)=>
    `<div class="wagon" data-pos="${i}"><span class="slot-num">${i+1}</span></div>`).join("");
  // garaj cu numere amestecate
  const mixed=shuffle(nums);
  $("pool").innerHTML=mixed.map(v=>
    `<div class="token c${v%10}" data-val="${v}">${v}</div>`).join("");
  bindTokens();
  clearMarks();
  selected=null;
  updateTexts();
}

function clearMarks(){document.querySelectorAll(".wagon").forEach(w=>w.classList.remove("ok","bad"));}

/* ---------------- MUTARE: drag (mouse+touch) + tap ---------------- */
let selected=null;          // token selectat prin atingere
let drag=null;              // {el, offX, offY, moved}

function bindTokens(){
  document.querySelectorAll(".token").forEach(t=>{
    t.addEventListener("pointerdown", onDown);
  });
  document.querySelectorAll(".wagon").forEach(w=>{
    w.addEventListener("click", ()=>onZoneTap(w));
  });
  $("pool").onclick=(e)=>{ if(e.target.id==="pool"||e.target.classList.contains("pool-label")) onZoneTap($("pool")); };
}

function onDown(e){
  const el=e.currentTarget;
  e.preventDefault();
  drag={el, moved:false, startX:e.clientX, startY:e.clientY};
  const r=el.getBoundingClientRect();
  drag.offX=e.clientX-r.left; drag.offY=e.clientY-r.top; drag.w=r.width; drag.h=r.height;
  el.setPointerCapture(e.pointerId);
  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", onUp);
}
function onMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(!drag.moved && Math.hypot(dx,dy)>7){
    drag.moved=true;
    drag.el.classList.add("dragging");
    drag.el.style.width=drag.w+"px"; drag.el.style.height=drag.h+"px";
  }
  if(drag.moved){
    drag.el.style.left=(e.clientX-drag.offX)+"px";
    drag.el.style.top=(e.clientY-drag.offY)+"px";
    highlightUnder(e.clientX,e.clientY);
  }
}
function onUp(e){
  const el=drag.el;
  el.removeEventListener("pointermove",onMove);
  el.removeEventListener("pointerup",onUp);
  el.removeEventListener("pointercancel",onUp);
  if(drag.moved){
    el.classList.remove("dragging"); el.style.left=el.style.top="";el.style.width=el.style.height="";
    const zone=zoneUnder(e.clientX,e.clientY);
    clearZoneHover();
    if(zone && zone.classList.contains("wagon")) dropInWagon(el,zone);
    else returnToPool(el);
  }else{
    // TAP: selectează / deselectează
    tapSelect(el);
  }
  drag=null;
}
function zoneUnder(x,y){
  const stack=document.elementsFromPoint(x,y);
  for(const n of stack){
    if(n.classList&&n.classList.contains("wagon")) return n;
    if(n.id==="pool"||(n.classList&&n.classList.contains("token")&&n.parentElement.id==="pool")) return $("pool");
  }
  return null;
}
function highlightUnder(x,y){
  clearZoneHover();
  const z=zoneUnder(x,y);
  if(z) z.classList.add("hover");
}
function clearZoneHover(){document.querySelectorAll(".hover").forEach(n=>n.classList.remove("hover"));}

/* plasare într-un vagon */
function dropInWagon(token, wagon){
  clearMarks();
  // dacă vagonul are deja un token, îl trimitem în garaj
  const existing=wagon.querySelector(".token");
  if(existing && existing!==token) returnToPool(existing);
  wagon.appendChild(token);
  wagon.classList.add("filled");
  token.classList.remove("sel");
  beep(560,.06);
}
function returnToPool(token){
  const w=token.closest(".wagon"); if(w) w.classList.remove("filled");
  token.classList.remove("sel");
  $("pool").appendChild(token);
}

/* tap-to-place */
function tapSelect(token){
  if(selected===token){ selected.classList.remove("sel"); selected=null; return; }
  if(selected) selected.classList.remove("sel");
  selected=token; token.classList.add("sel");
}
function onZoneTap(zone){
  if(!selected) return;
  clearMarks();
  if(zone.classList.contains("wagon")) dropInWagon(selected,zone);
  else returnToPool(selected);
  selected=null;
}

/* ---------------- VERIFICARE ---------------- */
function currentAnswer(){
  return [...document.querySelectorAll(".wagon")].map(w=>{
    const t=w.querySelector(".token"); return t?+t.dataset.val:null;
  });
}
function checkAnswer(){
  const ans=currentAnswer();
  if(ans.some(v=>v===null)){ flashInstr(T[lang].fill); return; }
  let allOK=true;
  document.querySelectorAll(".wagon").forEach((w,i)=>{
    if(ans[i]===sorted[i]) w.classList.add("ok");
    else {w.classList.add("bad"); allOK=false;}
  });
  if(allOK){ win(); }
  else { toast(T[lang].tryTitle,T[lang].trySub,900); beep(200,.18); }
}
function win(){
  score++; stars=Math.min(5,stars+1);
  $("score").textContent=score; renderStars();
  toast(T[lang].bravo,T[lang].bravoSub,1600);
  confetti(); winSound();
  setTimeout(newRound,1700);
}
function renderStars(){$("stars").textContent="⭐".repeat(stars)+"☆".repeat(5-stars);}

/* ajutor: pune un număr corect la locul lui */
function giveHint(){
  clearMarks();
  const wagons=[...document.querySelectorAll(".wagon")];
  for(let i=0;i<wagons.length;i++){
    const cur=wagons[i].querySelector(".token");
    if(cur && +cur.dataset.val===sorted[i]) continue;   // deja corect
    // caută tokenul corect oriunde
    const need=sorted[i];
    const tok=[...document.querySelectorAll(".token")].find(t=>+t.dataset.val===need);
    if(cur) returnToPool(cur);
    dropInWagon(tok,wagons[i]);
    wagons[i].classList.add("ok");
    beep(660,.08);
    return;
  }
}

/* ---------------- EFECTE ---------------- */
let toastTimer=null;
function toast(big,sub,ms){
  $("toastBig").textContent=big;$("toastSub").textContent=sub;
  $("toast").classList.add("show");clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").classList.remove("show"),ms);
}
function flashInstr(msg){const el=$("instr");const old=el.innerHTML;el.innerHTML=msg;el.style.color="#e63329";
  setTimeout(()=>{el.style.color="";updateTexts();},1200);}
function confetti(){
  const cols=["#ff7a7a","#ffd24d","#7ed957","#6ea8ff","#b98cff","#ff8fc7","#4dd0e1"];
  for(let i=0;i<80;i++){
    const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=cols[ri(0,cols.length-1)];
    c.style.transform=`rotate(${ri(0,360)}deg)`;
    const dur=1.6+Math.random()*1.4, delay=Math.random()*.4;
    c.animate([{transform:`translateY(0) rotate(0)`,opacity:1},
               {transform:`translateY(${window.innerHeight+40}px) rotate(${ri(360,900)}deg)`,opacity:.9}],
              {duration:dur*1000,delay:delay*1000,easing:"ease-in"});
    document.body.appendChild(c);setTimeout(()=>c.remove(),(dur+delay)*1000+50);
  }
}
/* sunete simple WebAudio */
let ac=null;
function beep(freq,dur,type="sine"){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;
    o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.12,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.start();o.stop(ac.currentTime+dur);}catch(e){}
}
function winSound(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"triangle"),i*110));}

function setOpt(k,v){ if(k==="range")range=v; else if(k==="count")count=+v; else order=v; newRound(); }
function populate(){
  $("selRange").innerHTML=RORDER.map(k=>`<option value="${k}" ${k===range?"selected":""}>0 – ${RANGES[k]}</option>`).join("");
  $("selCount").innerHTML=[4,5,6,7,8].map(k=>`<option value="${k}" ${k===count?"selected":""}>${k}</option>`).join("");
  $("selOrder").innerHTML=[["asc",T[lang].asc],["desc",T[lang].desc]].map(([k,v])=>`<option value="${k}" ${k===order?"selected":""}>${v}</option>`).join("");
}
function updateTexts(){
  const t=T[lang];
  $("tTitle").textContent=t.title;$("lRange").textContent=t.range;$("lCount").textContent=t.count;$("lOrder").textContent=t.order;
  $("tCheck").textContent=t.check;$("tHint").textContent=t.hint;$("tNew").textContent=t.neu;$("tLang").textContent=t.lang;
  $("tFoot").textContent=t.foot;
  $("instr").innerHTML=(order==="asc")?t.instrAsc:t.instrDesc;
  const touch=matchMedia("(pointer:coarse)").matches;
  $("poolLabel").textContent=touch?t.poolTap:t.poolDrag;
}
function toggleLang(){lang=lang==="ro"?"en":"ro";document.documentElement.lang=lang;populate();updateTexts();}
function toggleFull(){
  if(!document.fullscreenElement) (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen||(()=>{})).call(document.documentElement);
  else (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document);
}
