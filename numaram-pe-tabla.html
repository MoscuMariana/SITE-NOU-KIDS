<style>
  :root{
    --yellow:#FFC629; --yellow-d:#F4B400; --red:#E63946; --ink:#4A3520;
    --cream:#FFF6E2; --line:#E7D9B4; --green:#3AA655; --blue:#2F8FE0;
    --obj:90px;            /* mărimea obiectelor, calculată din JS */
    --box:clamp(84px,13vh,150px);
    --card:clamp(72px,12.5vh,150px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overflow:hidden}
  body{
    margin:0; font-family:'Nunito','Segoe UI',system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 10% 12%, #FFFBEF 0 38%, transparent 39%),
      radial-gradient(circle at 92% 88%, #FDEECF 0 42%, transparent 43%),
      var(--cream);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column;
  }

  /* ---------------- bara de sus ---------------- */
  .top{
    flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:10px 16px;
    background:linear-gradient(180deg,var(--yellow),var(--yellow-d));
    box-shadow:0 5px 0 #D99F0F, 0 10px 22px rgba(0,0,0,.10); z-index:20;
  }
  .top .logo{
    width:clamp(44px,6vh,64px); height:clamp(44px,6vh,64px); border-radius:16px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:clamp(26px,4vh,38px); overflow:hidden;
  }
  .top .logo img{width:100%;height:100%;object-fit:contain}
  .brand small{display:block; color:#7A5600; font-weight:900; font-size:11px; letter-spacing:2.5px}
  .brand h1{
    margin:0; font-family:'Baloo 2',cursive; font-weight:800; color:#fff;
    font-size:clamp(20px,3.4vh,32px); line-height:1.1; text-shadow:0 2px 0 rgba(0,0,0,.15);
  }
  .spacer{flex:1}
  .stars{
    display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px;
    padding:6px 18px; font-weight:900; font-size:clamp(18px,3vh,28px); color:var(--red);
    box-shadow:0 4px 0 #E4B23A;
  }
  .tbtn{
    border:none; cursor:pointer; border-radius:16px; background:#fff; color:var(--ink);
    font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(14px,2.2vh,20px);
    padding:10px 16px; box-shadow:0 4px 0 #E4B23A; display:flex; align-items:center; gap:8px;
  }
  .tbtn:active{transform:translateY(3px); box-shadow:0 1px 0 #E4B23A}
  .tbtn.red{background:var(--red); color:#fff; box-shadow:0 4px 0 #B32836}
  .tbtn.red:active{box-shadow:0 1px 0 #B32836}
  .tbtn .ic{font-size:1.2em}
  @media (max-width:820px){ .tbtn .tx{display:none} .brand h1{font-size:18px} }

  /* ---------------- zona de joc ---------------- */
  .stage{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; padding:10px 16px 0}
  .question{
    text-align:center; font-family:'Baloo 2',cursive; font-weight:800;
    font-size:clamp(18px,3vh,30px); color:var(--red); margin:0 0 6px;
  }
  .cols{flex:1 1 auto; display:flex; gap:12px; min-height:0}
  .col{
    flex:1 1 0; display:flex; flex-direction:column; align-items:center; min-width:0;
    background:rgba(255,255,255,.6); border:3px dashed var(--line); border-radius:22px; padding:8px;
  }
  .stack{
    flex:1 1 auto; width:100%; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; gap:2px; min-height:0; overflow:hidden;
  }
  .srow{display:flex; justify-content:center; align-items:center}
  .obj{
    width:var(--obj); height:var(--obj); display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--obj)*.86); line-height:1; position:relative; cursor:pointer;
    transition:transform .12s;
  }
  .obj img{width:100%; height:100%; object-fit:contain; pointer-events:none}
  .obj:active{transform:scale(.92)}
  .obj.counted::after{
    content:attr(data-n); position:absolute; top:2%; right:2%;
    width:44%; height:44%; min-width:22px; min-height:22px;
    border-radius:50%; background:var(--red); color:#fff;
    font-family:'Baloo 2',cursive; font-weight:800; font-size:calc(var(--obj)*.30);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 0 #B32836; animation:pop .18s ease-out;
  }
  .obj.counted{filter:drop-shadow(0 0 0 #fff) saturate(.55) opacity(.75)}

  .box{
    flex:0 0 auto; width:var(--box); height:var(--box); margin-top:8px; border-radius:20px;
    background:#fff; border:6px solid #2B2B2B; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',cursive; font-weight:800; font-size:calc(var(--box)*.55); color:var(--red);
    box-shadow:0 6px 0 rgba(0,0,0,.12); transition:.15s;
  }
  .box.hot{border-color:var(--blue); background:#EAF4FD; transform:scale(1.06)}
  .box.ok{border-color:var(--green); background:#E7F7EC; color:var(--green); box-shadow:0 6px 0 #BEE6C9}
  .box.bad{animation:shake .4s; border-color:var(--red); background:#FDECEE}
  .col.done{border-color:var(--green); background:rgba(231,247,236,.75)}

  /* ---------------- tava cu cifre ---------------- */
  .tray{
    flex:0 0 auto; display:flex; justify-content:center; align-items:center; flex-wrap:wrap;
    gap:clamp(8px,1.6vw,22px); padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .card{
    width:var(--card); height:calc(var(--card)*1.05); border-radius:22px; background:#fff;
    border:5px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',cursive; font-weight:800; font-size:calc(var(--card)*.62); color:var(--ink);
    box-shadow:0 7px 0 #D9C79A, 0 10px 20px rgba(0,0,0,.10);
    cursor:grab; touch-action:none; transition:transform .12s, box-shadow .12s;
  }
  .card.picked{
    border-color:var(--red); color:var(--red); background:#FFF0F1;
    transform:translateY(-10px) scale(1.06); box-shadow:0 12px 0 #F0B9BD;
    animation:bob 1s ease-in-out infinite;
  }
  .card.used{opacity:0; pointer-events:none; transform:scale(.5)}
  .ghost{
    position:fixed; z-index:999; pointer-events:none; opacity:.95;
    transform:translate(-50%,-50%) rotate(-4deg) scale(1.08);
  }

  /* ---------------- panou setări ---------------- */
  .drawer{
    position:fixed; inset:0 auto 0 0; width:min(340px,88vw); background:#fff; z-index:60;
    transform:translateX(-102%); transition:transform .25s ease; padding:18px; overflow:auto;
    box-shadow:14px 0 30px rgba(0,0,0,.18); border-radius:0 24px 24px 0;
  }
  .drawer.open{transform:none}
  .drawer h2{font-family:'Baloo 2',cursive; margin:0 0 14px; color:var(--red); font-size:22px}
  .field{margin-bottom:16px}
  .field label{display:block; font-weight:900; font-size:13px; margin-bottom:6px; letter-spacing:.4px}
  select{
    width:100%; padding:12px; border:3px solid var(--line); border-radius:14px; font-size:16px;
    font-family:inherit; font-weight:700; background:#FFFDF6; color:var(--ink);
  }
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    width:52px; height:52px; border:3px solid var(--line); background:#FFFDF6; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer;
  }
  .chip img{width:32px;height:32px;object-fit:contain}
  .chip.active{border-color:var(--red); background:#FFE9EA; box-shadow:0 3px 0 #F0B9BD}
  .seg{display:flex; gap:8px; flex-wrap:wrap}
  .seg button{
    flex:1; min-width:70px; padding:12px; border-radius:14px; border:3px solid var(--line);
    background:#FFFDF6; font-family:'Baloo 2',cursive; font-weight:800; font-size:17px;
    color:var(--ink); cursor:pointer;
  }
  .seg button.on{border-color:var(--red); background:#FFE9EA; color:var(--red)}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50; opacity:0; pointer-events:none; transition:.25s}
  .scrim.show{opacity:1; pointer-events:auto}
  .foot{margin-top:18px; font-size:12px; font-weight:800; color:#9A8B6B; text-align:center}

  /* ---------------- felicitare ---------------- */
  .win{
    position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(255,246,226,.94); flex-direction:column; gap:20px; text-align:center; padding:20px;
  }
  .win.show{display:flex}
  .win .big{font-family:'Baloo 2',cursive; font-weight:800; font-size:clamp(38px,9vh,90px); color:var(--red)}
  .win .sub{font-weight:900; font-size:clamp(16px,3vh,26px); color:var(--ink)}
  .conf{position:fixed; top:-30px; width:16px; height:24px; border-radius:4px; z-index:81; pointer-events:none}

  @keyframes shake{10%,90%{transform:translateX(-6px)}30%,70%{transform:translateX(8px)}50%{transform:translateX(-10px)}}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  @keyframes bob{50%{transform:translateY(-16px) scale(1.06)}}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>

<header class="top">
  <div class="logo" id="logoBox">🐝</div>
  <div class="brand">
    <small>KIDDY MSK</small>
    <h1 id="appTitle">Numărăm pe tablă</h1>
  </div>
  <div class="spacer"></div>
  <div class="stars">⭐ <span id="starCount">0</span></div>
  <button class="tbtn red" id="btnNew"><span class="ic">🔄</span><span class="tx" id="lbNew">Exercițiu nou</span></button>
  <button class="tbtn" id="btnFull"><span class="ic">⛶</span></button>
  <button class="tbtn" id="btnSet"><span class="ic">⚙️</span></button>
</header>

<main class="stage">
  <p class="question" id="question">Câte sunt? Trage cifra potrivită în căsuță.</p>
  <div class="cols" id="cols"></div>
</main>

<div class="tray" id="tray"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <h2 id="lbSettings">Setări</h2>

  <div class="field">
    <label id="lbLevel">Nivel / Vârstă</label>
    <select id="level"></select>
  </div>

  <div class="field">
    <label id="lbCols">Câte grămezi</label>
    <div class="seg" id="colsSeg"></div>
  </div>

  <div class="field">
    <label id="lbTheme">Element / Imagine</label>
    <div class="chips" id="themeChips"></div>
  </div>

  <div class="field">
    <label id="lbSound">Sunet</label>
    <div class="seg">
      <button id="sndOn" class="on">🔊 <span id="lbOn">Pornit</span></button>
      <button id="sndOff">🔇 <span id="lbOff">Oprit</span></button>
    </div>
  </div>

  <div class="field">
    <label>Limba / Language</label>
    <div class="seg">
      <button id="langRo" class="on">🇷🇴 Română</button>
      <button id="langEn">🇬🇧 English</button>
    </div>
  </div>

  <button class="tbtn red" id="btnClose" style="width:100%;justify-content:center"><span id="lbClose">Închide</span></button>
  <div class="foot">KIDDY MSK · www.kiddy-msk.com</div>
</aside>

<div class="win" id="win">
  <div class="big" id="winBig">BRAVO! 🎉</div>
  <div class="sub" id="winSub">Ai găsit toate numerele!</div>
  <button class="tbtn red" id="btnAgain" style="font-size:clamp(18px,3vh,28px);padding:16px 30px"><span id="lbAgain">Încă o dată</span></button>
</div>

<script>
/* ============================ i18n ============================ */
const T = {
  ro:{
    appTitle:"Numărăm pe tablă", settings:"Setări", level:"Nivel / Vârstă",
    cols:"Câte grămezi", theme:"Element / Imagine", sound:"Sunet", on:"Pornit", off:"Oprit",
    newEx:"Exercițiu nou", close:"Închide", again:"Încă o dată",
    question:"Câte sunt? Trage cifra potrivită în căsuță.",
    questionTap:"Atinge o cifră, apoi atinge căsuța potrivită.",
    win:"BRAVO! 🎉", winSub:"Ai găsit toate numerele!",
    levels:[
      {n:"Grădiniță mică (3-4 ani)", max:5},
      {n:"Grădiniță mare (5-6 ani)", max:8},
      {n:"Clasa pregătitoare", max:10},
      {n:"Clasa I", max:12},
      {n:"Clasa a II-a", max:20},
      {n:"Clasa a II-a — numere mari (până la 30)", max:30}
    ]
  },
  en:{
    appTitle:"Let's Count", settings:"Settings", level:"Level / Age",
    cols:"How many groups", theme:"Element / Picture", sound:"Sound", on:"On", off:"Off",
    newEx:"New round", close:"Close", again:"Play again",
    question:"How many? Drag the right number into the box.",
    questionTap:"Tap a number, then tap the matching box.",
    win:"WELL DONE! 🎉", winSub:"You found all the numbers!",
    levels:[
      {n:"Preschool (age 3-4)", max:5},
      {n:"Kindergarten (age 5-6)", max:8},
      {n:"Reception", max:10},
      {n:"Grade 1", max:12},
      {n:"Grade 2", max:20},
      {n:"Grade 2 — big numbers (up to 30)", max:30}
    ]
  }
};

/* ======================= teme / obiecte ======================= */
const THEMES = [
  /* --- imaginile Kiddy MSK --- */
  {id:"albina",   img:"albina",   e:"🐝", ro:"Albinuță",       en:"Bee"},
  {id:"albina2",  img:"albina2",  e:"🐝", ro:"Albina zburând", en:"Flying bee"},
  {id:"buburuza", img:"buburuza", e:"🐞", ro:"Buburuză",       en:"Ladybug"},
  {id:"urs",      img:"urs",      e:"🧸", ro:"Ursuleț",        en:"Bear"},
  {id:"stea",     img:"stea",     e:"⭐", ro:"Steluță",        en:"Star"},
  {id:"delfin",   img:"delfin",   e:"🐬", ro:"Delfin",         en:"Dolphin"},
  {id:"dovleac",  img:"dovleac",  e:"🎃", ro:"Dovleac",        en:"Pumpkin"},
  {id:"frunza",   img:"frunza",   e:"🍂", ro:"Frunză",         en:"Leaf"},
  /* --- emoji (rezervă / variație) --- */
  {id:"apple",  e:"🍎"}, {id:"heart",  e:"❤️"}, {id:"flower", e:"🌸"},
  {id:"fish",   e:"🐟"}, {id:"balloon",e:"🎈"}, {id:"strawb", e:"🍓"},
  {id:"sun",    e:"☀️"}, {id:"rainbow",e:"🌈"}, {id:"rabbit", e:"🐰"},
  {id:"mush",   e:"🍄"}, {id:"fluture",e:"🦋"}, {id:"ghinda", e:"🌰"},
  {id:"mixed",  e:"🎲"}
];

/* ============================ stare =========================== */
const S = {
  lang:"ro", levelIdx:1, cols:4, theme:"albina",
  items:[], cards:[], solved:[], picked:null, stars:0, sound:true
};

const $ = id => document.getElementById(id);
const colsBox = $("cols"), trayBox = $("tray");

function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function hasImg(k){ return typeof ELEMENTE!=="undefined" && ELEMENTE[k]; }

/* ============================ sunet =========================== */
let AC = null;
function tone(freq, dur, type, vol){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.value = vol || .18;
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sndPick  = () => tone(660,.12,"triangle",.14);
const sndOk    = () => { tone(784,.14,"sine",.2); setTimeout(()=>tone(1047,.22,"sine",.2),110); };
const sndBad   = () => tone(180,.25,"sawtooth",.1);
const sndCount = n => tone(420 + n*28,.09,"triangle",.12);
const sndWin   = () => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,"sine",.2), i*140));

/* ====================== construiește runda ==================== */
function newRound(){
  const L = T[S.lang].levels[S.levelIdx];
  const used = new Set();
  S.items = [];
  for(let c=0;c<S.cols;c++){
    let src;
    if(S.theme === "mixed"){
      const pool = THEMES.filter(t=>t.id!=="mixed");
      src = pool[rnd(0,pool.length-1)];
    } else {
      src = THEMES.find(t=>t.id===S.theme) || {e:"🍎"};
    }
    /* numere distincte cât timp e posibil — mai clar pentru copii */
    let n, tries = 0;
    do { n = rnd(1, L.max); tries++; } while(used.has(n) && tries < 40 && L.max >= S.cols);
    used.add(n);
    const it = {count:n};
    if(src.img && hasImg(src.img)) it.img = src.img; else it.emoji = src.e;
    S.items.push(it);
  }
  S.cards  = shuffle(S.items.map((it,i)=>({val:it.count, id:i})));
  S.solved = new Array(S.cols).fill(false);
  S.picked = null;
  $("win").classList.remove("show");
  drawBoard(); drawTray(); layout();
}

/* ========================= desenare board ===================== */
function drawBoard(){
  colsBox.innerHTML = "";
  S.items.forEach((it, c) => {
    const col = document.createElement("div"); col.className = "col";
    const stack = document.createElement("div"); stack.className = "stack";
    stack.dataset.col = c;
    col.appendChild(stack);

    const box = document.createElement("div");
    box.className = "box"; box.dataset.col = c;
    box.addEventListener("click", () => tapBox(c));
    col.appendChild(box);
    colsBox.appendChild(col);
  });
  fillStacks();
}

function fillStacks(){
  document.querySelectorAll(".stack").forEach(stack => {
    const c = +stack.dataset.col, it = S.items[c];
    stack.innerHTML = "";
    const sub = stack.dataset.sub ? +stack.dataset.sub : 1;
    const rows = Math.ceil(it.count / sub);
    /* rândul incomplet stă sus, grămada crește de jos în sus */
    for(let r = rows - 1; r >= 0; r--){
      const inRow = (r === rows-1) ? (it.count - r*sub) : sub;
      const row = document.createElement("div"); row.className = "srow";
      for(let j=0;j<inRow;j++){
        const o = document.createElement("div"); o.className = "obj";
        if(it.img) o.innerHTML = '<img src="' + ELEMENTE[it.img] + '" alt="">';
        else o.textContent = it.emoji || "🍎";
        o.addEventListener("click", () => countTap(stack, o));
        row.appendChild(o);
      }
      stack.appendChild(row);
    }
  });
}

/* numărare cu degetul: atingi obiectele și primesc 1,2,3… */
function countTap(stack, o){
  if(o.classList.contains("counted")){
    o.classList.remove("counted");
  } else {
    o.classList.add("counted");
  }
  let n = 0;
  stack.querySelectorAll(".obj.counted").forEach(el => { n++; el.dataset.n = n; });
  if(o.classList.contains("counted")) sndCount(n);
}

/* ========================= tava cu cifre ====================== */
function drawTray(){
  trayBox.innerHTML = "";
  S.cards.forEach((card, i) => {
    const d = document.createElement("div");
    d.className = "card"; d.textContent = card.val; d.dataset.i = i;
    attachDrag(d, card);
    trayBox.appendChild(d);
  });
}

/* ============ drag & drop + tap-tap (merg amândouă) =========== */
function attachDrag(el, card){
  let startX=0, startY=0, moved=false, ghost=null, hotBox=null;

  el.addEventListener("pointerdown", e => {
    if(el.classList.contains("used")) return;
    startX = e.clientX; startY = e.clientY; moved = false;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointermove", e => {
    if(!el.hasPointerCapture || !el.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!moved && Math.hypot(dx,dy) < 12) return;
    if(!moved){
      moved = true;
      ghost = el.cloneNode(true);
      ghost.className = "card ghost";
      document.body.appendChild(ghost);
      el.style.opacity = ".25";
      sndPick();
    }
    ghost.style.left = e.clientX + "px";
    ghost.style.top  = e.clientY + "px";
    const over = boxUnder(e.clientX, e.clientY);
    if(over !== hotBox){
      if(hotBox) hotBox.classList.remove("hot");
      hotBox = over;
      if(hotBox && !hotBox.classList.contains("ok")) hotBox.classList.add("hot");
    }
  });

  const finish = e => {
    if(ghost){ ghost.remove(); ghost = null; }
    el.style.opacity = "";
    if(hotBox) hotBox.classList.remove("hot");
    if(moved){
      const target = boxUnder(e.clientX, e.clientY);
      if(target) drop(+target.dataset.col, card, el);
      hotBox = null; moved = false;
      return;
    }
    /* tap simplu → selectează / deselectează cartonașul */
    if(S.picked && S.picked.el === el){
      el.classList.remove("picked"); S.picked = null;
    } else {
      document.querySelectorAll(".card.picked").forEach(c => c.classList.remove("picked"));
      el.classList.add("picked");
      S.picked = {card, el};
      sndPick();
    }
    hotBox = null;
  };

  el.addEventListener("pointerup", finish);
  el.addEventListener("pointercancel", () => {
    if(ghost){ ghost.remove(); ghost = null; }
    el.style.opacity = ""; if(hotBox) hotBox.classList.remove("hot"); hotBox = null; moved = false;
  });
}

function boxUnder(x,y){
  const el = document.elementFromPoint(x,y);
  if(!el) return null;
  const b = el.closest(".box");
  return (b && !b.classList.contains("ok")) ? b : null;
}

function tapBox(c){
  if(!S.picked || S.solved[c]) return;
  drop(c, S.picked.card, S.picked.el);
}

function drop(c, card, el){
  const box = document.querySelector('.box[data-col="' + c + '"]');
  if(!box || S.solved[c]) return;

  if(card.val === S.items[c].count){
    S.solved[c] = true;
    box.textContent = card.val;
    box.classList.add("ok");
    box.closest(".col").classList.add("done");
    el.classList.add("used");
    if(S.picked && S.picked.el === el){ S.picked = null; }
    el.classList.remove("picked");
    S.stars++; $("starCount").textContent = S.stars;
    sndOk();
    if(S.solved.every(Boolean)) setTimeout(celebrate, 450);
  } else {
    box.classList.add("bad");
    setTimeout(()=>box.classList.remove("bad"), 450);
    sndBad();
  }
}

/* =========================== felicitare ======================= */
function celebrate(){
  sndWin();
  const t = T[S.lang];
  $("winBig").textContent = t.win; $("winSub").textContent = t.winSub;
  $("win").classList.add("show");
  const colors = ["#FFC629","#E63946","#3AA655","#2F8FE0","#FF8A3D"];
  for(let i=0;i<40;i++){
    const p = document.createElement("div");
    p.className = "conf";
    p.style.left = Math.random()*100 + "vw";
    p.style.background = colors[i % colors.length];
    p.style.animation = "fall " + (1.8 + Math.random()*1.6) + "s linear " + (Math.random()*.8) + "s forwards";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 4200);
  }
}

/* ===================== mărimea obiectelor ===================== */
function layout(){
  const stacks = [...document.querySelectorAll(".stack")];
  if(!stacks.length) return;
  const h = stacks[0].clientHeight, w = stacks[0].clientWidth;
  if(h < 20 || w < 20){ return requestAnimationFrame(layout); }
  const maxCount = Math.max(1, ...S.items.map(i => i.count));

  let size = 0, sub = 1;
  for(let s = 1; s <= Math.min(6, maxCount); s++){
    const rows = Math.ceil(maxCount / s);
    const byH = (h / rows) * 0.96;
    const byW = (w / s) * 0.94;
    const val = Math.min(190, byH, byW);
    if(val > size + 0.01){ size = val; sub = s; }
  }
  document.documentElement.style.setProperty("--obj", Math.max(18, Math.floor(size)) + "px");
  stacks.forEach(st => st.dataset.sub = sub);
  fillStacks();
}
window.addEventListener("resize", () => { clearTimeout(window._lt); window._lt = setTimeout(layout, 120); });
window.addEventListener("orientationchange", () => setTimeout(layout, 300));

/* ========================= UI / setări ======================== */
function buildLevels(){
  const sel = $("level"); sel.innerHTML = "";
  T[S.lang].levels.forEach((l,i)=>{
    const o = document.createElement("option"); o.value = i; o.textContent = l.n; sel.appendChild(o);
  });
  sel.value = S.levelIdx;
}
function buildColsSeg(){
  const box = $("colsSeg"); box.innerHTML = "";
  [3,4,5,6].forEach(n=>{
    const b = document.createElement("button");
    b.textContent = n; if(n === S.cols) b.classList.add("on");
    b.onclick = () => { S.cols = n; buildColsSeg(); newRound(); };
    box.appendChild(b);
  });
}
function buildChips(){
  const box = $("themeChips"); box.innerHTML = "";
  THEMES.forEach(t=>{
    const d = document.createElement("div");
    d.className = "chip" + (t.id === S.theme ? " active" : "");
    if(t.img && hasImg(t.img)){
      d.innerHTML = '<img src="' + ELEMENTE[t.img] + '" alt="">';
      d.title = (S.lang === "ro" ? t.ro : t.en) || t.id;
    } else { d.textContent = t.e; d.title = t.id; }
    d.onclick = () => { S.theme = t.id; buildChips(); newRound(); };
    box.appendChild(d);
  });
}
function applyLang(){
  const t = T[S.lang];
  document.documentElement.lang = S.lang;
  $("appTitle").textContent = t.appTitle;
  $("lbSettings").textContent = t.settings;
  $("lbLevel").textContent = t.level;
  $("lbCols").textContent = t.cols;
  $("lbTheme").textContent = t.theme;
  $("lbSound").textContent = t.sound;
  $("lbOn").textContent = t.on;
  $("lbOff").textContent = t.off;
  $("lbNew").textContent = t.newEx;
  $("lbClose").textContent = t.close;
  $("lbAgain").textContent = t.again;
  $("question").textContent = t.question;
  buildLevels(); buildChips();
}

$("level").onchange = e => { S.levelIdx = +e.target.value; newRound(); };
$("btnNew").onclick = newRound;
$("btnAgain").onclick = newRound;
$("btnSet").onclick = () => { $("drawer").classList.add("open"); $("scrim").classList.add("show"); };
$("btnClose").onclick = closeDrawer;
$("scrim").onclick = closeDrawer;
function closeDrawer(){ $("drawer").classList.remove("open"); $("scrim").classList.remove("show"); setTimeout(layout,260); }

$("btnFull").onclick = () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
  setTimeout(layout, 400);
};
$("sndOn").onclick  = () => { S.sound = true;  $("sndOn").classList.add("on");  $("sndOff").classList.remove("on"); sndPick(); };
$("sndOff").onclick = () => { S.sound = false; $("sndOff").classList.add("on"); $("sndOn").classList.remove("on"); };
$("langRo").onclick = () => { S.lang = "ro"; $("langRo").classList.add("on"); $("langEn").classList.remove("on"); applyLang(); };
$("langEn").onclick = () => { S.lang = "en"; $("langEn").classList.add("on"); $("langRo").classList.remove("on"); applyLang(); };

/* logo din logo.js, dacă există */
if(typeof LOGO_SRC !== "undefined"){
  $("logoBox").innerHTML = '<img src="' + LOGO_SRC + '" alt="Kiddy MSK">';
} else if(hasImg("albina")){
  $("logoBox").innerHTML = '<img src="' + ELEMENTE.albina + '" alt="Kiddy MSK">';
}
/* re-așezare când se încarcă imaginile */
if(typeof ELEMENTE !== "undefined"){
  Object.keys(ELEMENTE).forEach(k => { const im = new Image(); im.onload = layout; im.src = ELEMENTE[k]; });
}

/* boot */
applyLang(); buildColsSeg(); newRound();
window.addEventListener("load", () => setTimeout(layout, 150));
</script>
