<title>Colorează peștii pe intervale – TABLĂ INTERACTIVĂ – Kiddy MSK</title>

<style>
  :root{--rosu:#e63329;--galben:#f5c518;--negru:#1a1a1a;--mov:#8a4fd0;--portocaliu:#f39c12;--verde:#2fae5a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overscroll-behavior:none;height:100%;}
  body{font-family:"Comic Sans MS","Segoe UI",sans-serif;background:#0d2b3e;color:var(--negru);padding:8px 8px 122px;
       -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .toolbar{max-width:1400px;margin:0 auto 10px;background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;}
  .toolbar h1{font-size:15px;color:var(--rosu);margin-right:auto;}
  .btn{border:none;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;transition:.15s transform;}
  .btn:active{transform:translateY(1px);}
  .btn-gen{background:var(--rosu);color:#fff;box-shadow:0 4px 0 #a8231c;}
  .btn-save{background:#2fae5a;color:#fff;box-shadow:0 4px 0 #1f7d40;}
  .btn-lang{background:#2f6fed;color:#fff;box-shadow:0 4px 0 #1d4fb0;}
  .btn-ans{background:#8a4fd0;color:#fff;box-shadow:0 4px 0 #5f2fa0;}
  .btn-full{background:#334155;color:#fff;box-shadow:0 4px 0 #1e293b;}
  .sel-wrap{display:inline-flex;align-items:center;gap:6px;font-weight:bold;font-size:12.5px;color:#333;}
  .sel-wrap select{font-family:inherit;font-size:12.5px;font-weight:bold;color:var(--rosu);padding:7px 9px;border:2px solid var(--galben);border-radius:999px;background:#fffdf5;cursor:pointer;}

  .stagewrap{display:flex;justify-content:center;}
  .stage{width:1280px;transform-origin:top center;}
  .board{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:18px;box-shadow:0 10px 34px rgba(0,0,0,.45);}
  .sky{position:absolute;inset:0;z-index:0;background:linear-gradient(#eaf6ff 0%,#dff0fb 10%,#bfe4fb 18%,#8fd0f0 28%,#57b6e6 50%,#2f8fd0 100%);}
  .content{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;}
  .head{background:rgba(255,255,255,.92);padding:10px 24px;display:flex;align-items:center;gap:18px;border-bottom:4px solid var(--galben);}
  .logo-wrap{width:56px;height:56px;flex:0 0 auto;}.logo-wrap img{width:100%;height:100%;object-fit:contain;}
  .titlu{font-size:28px;font-weight:bold;color:#c0392b;letter-spacing:1px;}
  .instr{font-size:16px;color:#333;line-height:1.35;}
  .field{flex:1;}
  .sea{position:relative;flex:1;}
  .island{position:absolute;left:50%;top:24%;transform:translateX(-50%);width:370px;z-index:3;}
  .island .palm{position:absolute;left:8px;bottom:34px;z-index:1;opacity:.92;}
  .island .crabs{position:relative;width:100%;z-index:2;}
  .island .crabs img{width:100%;display:block;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25));}
  .bubbles{position:absolute;left:50%;top:2%;transform:translateX(-50%);width:1040px;display:flex;justify-content:space-between;gap:14px;z-index:5;}
  .bubble{flex:1;color:#fff;font-size:16px;font-weight:bold;border-radius:16px;padding:10px 14px;line-height:1.3;box-shadow:0 4px 10px rgba(0,0,0,.3);position:relative;}
  .bubble b{font-size:20px;}
  .bubble.mov{background:var(--mov);} .bubble.por{background:var(--portocaliu);} .bubble.ver{background:var(--verde);}
  .bubble::after{content:"";position:absolute;bottom:-10px;left:36px;border:10px solid transparent;border-top-color:inherit;}
  .fish{position:absolute;width:110px;height:64px;z-index:2;transform:translate(-50%,-50%);cursor:pointer;}
  .fish.tap{animation:pop .22s ease;}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(1);}45%{transform:translate(-50%,-50%) scale(1.2);}100%{transform:translate(-50%,-50%) scale(1);}}
  .fish svg{width:100%;height:100%;overflow:visible;pointer-events:none;}
  .fish .fn{font-size:19px;font-weight:bold;fill:#1a1a1a;font-family:"Comic Sans MS",sans-serif;}
  .foot{position:relative;z-index:6;background:rgba(255,255,255,.88);padding:5px 24px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap;font-size:12px;color:#375;}
  .foot b{color:var(--rosu);}.foot a{color:#2f6fed;text-decoration:none;}

  .rez{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;z-index:9;background:rgba(255,255,255,.97);
       border:6px solid var(--galben);border-radius:24px;padding:22px 26px;box-shadow:0 14px 40px rgba(0,0,0,.4);text-align:center;}
  .rez .scor{font-size:34px;font-weight:bold;color:#c0392b;margin-bottom:8px;}
  .rez .det{font-size:19px;color:#333;line-height:1.6;}
  .rez .det span{display:inline-block;margin:0 12px;}
  .rez .close{position:absolute;right:12px;top:6px;border:none;background:none;font-size:26px;cursor:pointer;color:#888;}

  .palette{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);border-top:5px solid var(--galben);
           box-shadow:0 -6px 20px rgba(0,0,0,.3);padding:10px 12px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .pbtn{border:5px solid transparent;border-radius:18px;padding:12px 22px;font-family:inherit;font-size:19px;font-weight:bold;color:#fff;cursor:pointer;
        min-width:150px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.22);}
  .pbtn.mov{background:var(--mov);} .pbtn.por{background:var(--portocaliu);} .pbtn.ver{background:var(--verde);}
  .pbtn.era{background:#fff;color:#444;border-color:#bbb;box-shadow:0 5px 0 #ccc;}
  .pbtn.sel{border-color:#111;transform:translateY(-4px);box-shadow:0 9px 0 rgba(0,0,0,.28);}
  .pbtn .dot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid rgba(0,0,0,.25);}
  .pact{border:none;border-radius:18px;padding:14px 24px;font-family:inherit;font-size:19px;font-weight:bold;cursor:pointer;min-height:64px;}
  .pact.check{background:#2f6fed;color:#fff;box-shadow:0 5px 0 #1d4fb0;}
  .pact.clear{background:#eee;color:#444;box-shadow:0 5px 0 #ccc;}
</style>
</head>
<body>
<div class="toolbar">
  <h1>🦀 Colorează peștii – TABLĂ INTERACTIVĂ – KIDDY MSK</h1>
  <label class="sel-wrap"><span id="maxLabel">Interval:</span><select id="selMax" onchange="schimba(this.value)"></select></label>
  <label class="sel-wrap"><span id="gapLabel">Reguli:</span><select id="selGap" onchange="schimbaGap(this.value)">
      <option value="0">Cu capcane (pești fără regulă)</option>
      <option value="1">Fără capcane (toți intră într-o culoare)</option>
  </select></label>
  <button class="btn btn-gen" onclick="genereaza()">🔄 <span data-t="gen">Generează</span></button>
  <button class="btn btn-ans" onclick="toggleAns()"><span id="ansLabel">👁️ Colorează (răspuns)</span></button>
  <button class="btn btn-full" onclick="fullscreen()">⛶ <span data-t="full">Ecran complet</span></button>
  <button class="btn btn-save" onclick="salveaza()">💾 <span data-t="save">Salvează JPG</span></button>
  <button class="btn btn-lang" onclick="comuta()">🌐 <span id="langLabel">English</span></button>
</div>

<div class="stagewrap" id="stagewrap"><div class="stage" id="stage"><div class="board" id="page"></div></div></div>

<div class="palette">
  <button class="pbtn mov sel" data-c="mov" onclick="alege('mov')"><span class="dot"></span><span id="lbMov">MOV</span></button>
  <button class="pbtn por" data-c="por" onclick="alege('por')"><span class="dot"></span><span id="lbPor">PORTOCALIU</span></button>
  <button class="pbtn ver" data-c="ver" onclick="alege('ver')"><span class="dot"></span><span id="lbVer">VERDE</span></button>
  <button class="pbtn era" data-c="era" onclick="alege('era')">🧽 <span id="lbEra">Șterge</span></button>
  <button class="pact check" onclick="verifica()">✅ <span id="lbCheck">Verifică</span></button>
  <button class="pact clear" onclick="stergeTot()">♻️ <span id="lbClear">Șterge tot</span></button>
</div>

    instr:"Pick a colour from the bottom bar, then tap the fish that match the crabs' rules. Press CHECK at the end.",
    r1:"Fish with a number less than %A% → PURPLE",
    r2:"Fish with a number between %B% and %C% → ORANGE",
    r3:"Fish with a number greater than %D% → GREEN",
    gen:"Generate",save:"Save JPG",full:"Fullscreen",max:"Range:",rules:"Rules:",
    langBtn:"Română",showAns:"👁️ Color (answer)",hideAns:"🙈 Hide colors",
    mov:"PURPLE",por:"ORANGE",ver:"GREEN",era:"Erase",check:"Check",clear:"Clear all",
    scorBun:"WELL DONE! Every fish is coloured correctly! 🎉",
    scor:"You coloured %OK% out of %TOT% fish correctly.",
    dGresit:"❌ wrong colour: %N%",dLipsa:"⬜ left uncoloured: %N%",dAlb:"⬜ should stay white: %N%",
    hint:"Fish with a red ✗ are wrong – the small dot shows the correct colour.",
    footer:"Kindergarten · Preschool · Grade 1",footer2:"Grade 2 · Grade 3 · Grade 4"}
};
let lang="ro",showAns=false,checked=false,tool="mov",noGap=false;

/* fiecare set = [A,B,C,D]: n<A → mov | B≤n≤C → portocaliu | n>D → verde | rest → necolorat */
const PRESETS={
  "20":{max:20,label:"0 - 20",sets:[[6,8,14,16],[5,7,13,15],[7,9,13,16]]},
  "31":{max:31,label:"0 - 31",sets:[[9,12,22,25],[8,11,20,24],[10,13,23,26]]},
  "50":{max:50,label:"0 - 50",sets:[[13,18,35,40],[15,20,32,38],[12,17,37,42]]},
  "100":{max:100,label:"0 - 100",sets:[[25,30,70,75],[20,35,65,80],[30,40,75,85]]},
  "1000":{max:1000,label:"0 - 1000",sets:[[250,300,700,750],[200,350,650,800],[300,400,750,850]]}
};
const MORD=["20","31","50","100","1000"];let maxK="31";

function ri(lo,hi){return lo+Math.floor(Math.random()*(hi-lo+1));}
function cat(n){const r=D.rules;if(!r)return "none";if(n<r.A)return "mov";if(n>=r.B&&n<=r.C)return "por";if(n>r.D)return "ver";return "none";}
const FILL={mov:"#c9a9ee",por:"#ffcf8a",ver:"#a9e08c",none:"#ffffff"};

let fishes=[];let D={};
function genData(){
  const p=PRESETS[maxK];const M=p.max;
  const s=p.sets[ri(0,p.sets.length-1)];
  D.rules=noGap?{A:s[0],B:s[0],C:s[2],D:s[2]}:{A:s[0],B:s[1],C:s[2],D:s[3]};
  fishes=[];
  const cols=9, rows=6, x0=6,x1=94,y0=9,y1=92;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const off=(r%2)? (x1-x0)/(cols-1)/2 : 0;
      const bx=x0+(x1-x0)*(c/(cols-1))+off;
      const by=y0+(y1-y0)*(r/(rows-1));
      if(bx>x1) continue;
      const jx=bx+ri(-2,2), jy=by+ri(-3,3);
      if(jy<21 && jx>10 && jx<90) continue;                  // baloanele cu reguli
      if(jy>=21 && jy<64 && jx>31 && jx<69) continue;         // insula cu crabi
      fishes.push({x:jx,y:jy,n:ri(1,M),flip:Math.random()<0.5,col:null});
    }
  }
  checked=false;
}
function svgFish(n,fill,flip,mark,corect){
  const sc=flip?'transform="scale(-1,1) translate(-74,0)"':'';
  let m="";
  if(mark==="ok"){
    m=`<g><circle cx="63" cy="4" r="9.5" fill="#2fae5a" stroke="#fff" stroke-width="2"/>
       <path d="M58.5 4 l3.2 3.4 l6.2 -7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  }else if(mark==="bad"){
    m=`<g><circle cx="63" cy="4" r="9.5" fill="#e63329" stroke="#fff" stroke-width="2"/>
       <path d="M59.5 0.5 l7 7 M66.5 0.5 l-7 7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
       <circle cx="12" cy="36" r="7" fill="${FILL[corect]}" stroke="#333" stroke-width="1.6"/></g>`;
  }
  return `<svg viewBox="0 0 74 40"><g ${sc}>
    <polygon points="52,20 72,8 72,32" fill="${fill}" stroke="#333" stroke-width="1.4"/>
    <ellipse cx="30" cy="20" rx="28" ry="14" fill="${fill}" stroke="#333" stroke-width="1.5"/>
    <circle cx="12" cy="15" r="2.4" fill="#333"/>
    </g>
    <text x="36" y="26" text-anchor="middle" class="fn">${n}</text>${m}</svg>`;
}
function svgPalm(){return `<svg width="130" height="165" viewBox="0 0 120 150">
  <path d="M58 150 C54 110 56 80 60 60 C64 80 66 110 62 150 Z" fill="#a9732e" stroke="#7a4f18" stroke-width="2"/>
  <g fill="#3aa655" stroke="#2e8748" stroke-width="1.5">
   <path d="M60 58 C40 40 18 40 4 52 C24 46 46 50 60 62Z"/>
   <path d="M60 58 C80 40 102 40 116 52 C96 46 74 50 60 62Z"/>
   <path d="M60 56 C46 30 24 22 8 26 C30 30 48 42 60 60Z"/>
   <path d="M60 56 C74 30 96 22 112 26 C90 30 72 42 60 60Z"/>
   <path d="M60 54 C56 30 60 10 60 4 C66 16 66 40 60 58Z"/>
  </g></svg>`;}

function fishFill(f){return showAns?FILL[cat(f.n)]:(f.col?FILL[f.col]:"#ffffff");}
function fishMark(f){if(!checked||showAns)return "";return ((f.col||"none")===cat(f.n))?"ok":"bad";}

function render(){
  const t=T[lang];const r=D.rules;
  const fishHTML=fishes.map((f,i)=>
    `<div class="fish" data-i="${i}" style="left:${f.x}%;top:${f.y}%">${svgFish(f.n,fishFill(f),f.flip,fishMark(f),cat(f.n))}</div>`
  ).join("");
  const logo=(typeof IMG!=="undefined"&&IMG.logo)?`<img src="${IMG.logo}" alt="KIDDY MSK">`:"";
  document.getElementById("page").innerHTML=`
  <div class="sky"></div>
  <div class="content">
    <div class="head">
      <div class="logo-wrap">${logo}</div>
      <div class="field"><div class="titlu">${t.titlu}</div><div class="instr">${t.instr}</div></div>
    </div>
    <div class="sea">
      <div class="bubbles">
        <div class="bubble mov">${t.r1.replace("%A%","<b>"+r.A+"</b>")}</div>
        <div class="bubble por">${t.r2.replace("%B%","<b>"+r.B+"</b>").replace("%C%","<b>"+r.C+"</b>")}</div>
        <div class="bubble ver">${t.r3.replace("%D%","<b>"+r.D+"</b>")}</div>
      </div>
      <div class="island">
        <div class="palm">${svgPalm()}</div>
        <div class="crabs"><img src="${IMG_CRAB}" alt="crabi"></div>
      </div>
      ${fishHTML}
    </div>
    <div class="foot">
      <span>📘 <a href="https://www.facebook.com/Kiddymsk" target="_blank"><b>Kiddymsk</b></a> – ${t.footer}</span>
      <span>📘 <a href="https://www.facebook.com/kiddymskNOU" target="_blank"><b>kiddymskNOU</b></a> – ${t.footer2}</span>
    </div>
    ${checked?panouRezultat():""}
  </div>`;
  fit();
}
/* ---------- interacțiune touch ---------- */
function alege(c){tool=c;document.querySelectorAll(".pbtn").forEach(b=>b.classList.toggle("sel",b.dataset.c===c));}
function atinge(el){
  const i=+el.dataset.i;const f=fishes[i];if(!f)return;
  if(tool==="era") f.col=null; else f.col=(f.col===tool)?null:tool;
  if(checked){checked=false;render();return;}
  el.innerHTML=svgFish(f.n,fishFill(f),f.flip,"",cat(f.n));
  el.classList.remove("tap");void el.offsetWidth;el.classList.add("tap");
}
document.getElementById("page").addEventListener("pointerdown",e=>{
  if(showAns)return;
  const el=e.target.closest(".fish");if(el)atinge(el);
});
/* ---------- verificare ---------- */
function verifica(){checked=true;showAns=false;document.getElementById("ansLabel").textContent=T[lang].showAns;render();}
function stergeTot(){fishes.forEach(f=>f.col=null);checked=false;render();}
function panouRezultat(){
  const t=T[lang];let ok=0,gres=0,lipsa=0,alb=0;
  fishes.forEach(f=>{const c=cat(f.n),u=f.col||"none";
    if(u===c){ok++;return;}
    if(u==="none") lipsa++; else if(c==="none") alb++; else gres++;});
  const tot=fishes.length;
  const cap=(ok===tot)?t.scorBun:t.scor.replace("%OK%",ok).replace("%TOT%",tot);
  let det="";
  if(gres) det+=`<span>${t.dGresit.replace("%N%",gres)}</span>`;
  if(lipsa) det+=`<span>${t.dLipsa.replace("%N%",lipsa)}</span>`;
  if(alb) det+=`<span>${t.dAlb.replace("%N%",alb)}</span>`;
  if(ok<tot) det+=`<br><span style="font-size:14px;color:#666">${t.hint}</span>`;
  return `<div class="rez"><button class="close" onclick="checked=false;render()">✕</button>
          <div class="scor">${cap}</div><div class="det">${det}</div></div>`;
}
/* ---------- restul ---------- */
function genereaza(){genData();render();}
function toggleAns(){showAns=!showAns;checked=false;document.getElementById("ansLabel").textContent=showAns?T[lang].hideAns:T[lang].showAns;render();}
function schimba(v){maxK=v;genereaza();}
function schimbaGap(v){noGap=(v==="1");genereaza();}
function fullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen();}}
function fit(){
  const st=document.getElementById("stage");
  const tb=document.querySelector(".toolbar").offsetHeight;
  const pal=document.querySelector(".palette").offsetHeight;
  const h=window.innerHeight-tb-pal-30, w=window.innerWidth-16;
  const s=Math.min(1.6,h/720,w/1280);
  st.style.transform=`scale(${s})`;
  document.getElementById("stagewrap").style.height=(720*s)+"px";
}
window.addEventListener("resize",fit);
document.addEventListener("fullscreenchange",()=>setTimeout(fit,120));
function salveaza(){
  if(typeof html2canvas==="undefined"){alert("html2canvas.min.js lipsește din folder.");return;}
  const page=document.getElementById("page");const btns=document.querySelectorAll(".toolbar .btn");btns.forEach(b=>b.disabled=true);
  const st=document.getElementById("stage");const old=st.style.transform;st.style.transform="none";
  html2canvas(page,{scale:2,backgroundColor:"#ffffff",useCORS:true}).then(canvas=>{
    const url=canvas.toDataURL("image/jpeg",0.95);const a=document.createElement("a");const d=new Date();
    const stamp=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    a.href=url;a.download="Tabla-ColoreazaPestii-"+maxK+"-KiddyMSK-"+stamp+".jpg";document.body.appendChild(a);a.click();a.remove();
  }).catch(err=>alert("Nu am putut salva: "+err)).finally(()=>{st.style.transform=old;btns.forEach(b=>b.disabled=false);});}
function populeaza(){
  const t=T[lang];
  document.getElementById("selMax").innerHTML=MORD.map(k=>`<option value="${k}" ${k===maxK?"selected":""}>${PRESETS[k].label}</option>`).join("");
  document.getElementById("maxLabel").textContent=t.max;
  document.getElementById("gapLabel").textContent=t.rules;
  document.getElementById("lbMov").textContent=t.mov;document.getElementById("lbPor").textContent=t.por;
  document.getElementById("lbVer").textContent=t.ver;document.getElementById("lbEra").textContent=t.era;
  document.getElementById("lbCheck").textContent=t.check;document.getElementById("lbClear").textContent=t.clear;}
function comuta(){lang=(lang==="ro")?"en":"ro";document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=T[lang][el.dataset.t];});
  document.getElementById("langLabel").textContent=T[lang].langBtn;
  document.getElementById("ansLabel").textContent=showAns?T[lang].hideAns:T[lang].showAns;
  document.documentElement.lang=lang;populeaza();render();}
populeaza();genereaza();
</script>
</body>
</html>
