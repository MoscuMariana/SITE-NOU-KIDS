<style>

    --shadow:0 10px 26px -12px rgba(58,46,42,.28);

  *{box-sizing:border-box;margin:0;padding:0}
  body{

  }
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}

  /* HEADER */
  header{position:sticky;top:0;z-index:50;background:rgba(255,248,239,.9);backdrop-filter:blur(12px);border-bottom:2px solid #f3e3d0}

  .logo-text{font-family:'Fredoka',sans-serif;font-weight:700;font-size:23px;color:var(--ink)}

  .back-link{font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;text-decoration:none;color:var(--ink-soft);background:#fff;padding:9px 18px;border-radius:999px;transition:.2s;border:2px solid #f3e7d9}
  .back-link:hover{color:var(--ink);border-color:var(--accent-theme)}

  .fisa-head{text-align:center;padding:34px 0 8px;scroll-margin-top:90px}
  .lvl-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:#fff;padding:6px 16px;border-radius:999px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.4px}

  .fisa-cat{font-family:'Fredoka',sans-serif;font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-theme);margin-top:8px;display:block}

  .fisa-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .tag-pill{font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}

  /* SLIDER */
  .slider-wrap{margin:26px auto 0;max-width:760px}
  .stage{
    position:relative;background:#fff;border-radius:var(--radius);
    box-shadow:var(--shadow);border:2px solid var(--accent-theme);
    overflow:hidden;
  }
  .stage-inner{
    position:relative;width:100%;aspect-ratio:1/1.414; /* A4 portret */
    display:grid;place-items:center;background:#faf3ea;
  }
  .stage-inner img{width:100%;height:100%;object-fit:contain;display:none}
  .stage-inner img.on{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .loading{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column;gap:14px;color:var(--ink-soft);font-weight:700}
  .spin{width:42px;height:42px;border:4px solid #f0e3d3;border-top-color:var(--accent-theme);border-radius:50%;animation:rot 1s linear infinite}

  /* counter pe imagine */
  .page-count{position:absolute;top:14px;right:14px;background:rgba(58,46,42,.82);color:#fff;font-size:13px;font-weight:800;padding:5px 13px;border-radius:999px;z-index:5}

  /* săgeți */
  .nav-arrow{

  .nav-arrow:disabled{opacity:.3;cursor:not-allowed;transform:translateY(-50%)}
  .nav-arrow.prev{left:12px}
  .nav-arrow.next{right:12px}

  .btn-dl-page:hover{background:#e8d9c6}
  .btn-dl-pdf{background:var(--accent-theme);color:#fff;box-shadow:0 6px 16px -8px rgba(58,46,42,.5)}

  .thumbs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:24px 0 0}
  .thumb{width:62px;height:88px;border-radius:10px;overflow:hidden;cursor:pointer;border:3px solid transparent;background:#faf3ea;transition:.15s;flex:0 0 auto}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb.active{border-color:var(--accent-theme)}
  .thumb:hover{transform:translateY(-3px)}

  .set-desc{margin:40px auto 0;max-width:680px;background:#fff;border-radius:var(--radius);padding:30px 34px;box-shadow:var(--shadow);border:1px solid #f3e7d9;border-top:5px solid var(--accent-theme)}

  .set-desc h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--ink);margin:20px 0 6px}

  .set-desc p.lead{font-size:17px;color:var(--ink);font-weight:600;line-height:1.6}
  .set-desc ul.skills{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .set-desc ul.skills li{position:relative;padding-left:30px;font-size:15.5px;color:var(--ink-soft);line-height:1.5}
  .set-desc ul.skills li::before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;display:grid;place-items:center;background:var(--accent-theme);color:#fff;border-radius:50%;font-size:12px;font-weight:800}

    .logo-text{font-size:17px}
    .nav-arrow{width:42px;height:42px;font-size:20px}
    .btn{padding:12px 18px;font-size:14px}
    .thumb{width:52px;height:74px}
  }
</style>

function pdfKey(pdfUrl){
  // extrage numele fișierului fără cale și fără extensie
  try{
    const last = decodeURIComponent(pdfUrl).split("/").pop();
    return last.replace(/\.[a-zA-Z0-9]+$/, "").trim();
  }catch(e){ return ""; }
}

function setDescriptionData(){
  const key = pdfKey(data.pdf);
  if(SET_DESCRIPTIONS[key]) return SET_DESCRIPTIONS[key];
  // text generat automat pentru fișele fără descriere proprie
  const lvl = LVL_NAME[data.level] || data.level || "";
  const teme = data.themes.map(t=>THEME_NAME[t]||t).join(", ");
  let s = "Acest material";
  if(lvl) s += " este creat pentru " + lvl.toLowerCase();
  if(teme) s += " și are ca temă " + teme.toLowerCase();
  s += ". Conține " + (data.pages || "mai multe") + " pagini de activități pe care le poți răsfoi în galeria de mai sus, descărca individual sau salva ca PDF complet.";
  return s; // string simplu
}

/* construiește HTML-ul casetei "Despre acest set" */
function setDescriptionHTML(){
  const d = setDescriptionData();
  if(typeof d === "string"){
    return `<h2>Despre acest set</h2><p>${d}</p>`;
  }
  let html = `<h2>Despre acest set</h2>`;
  if(d.intro) html += `<p class="lead">${d.intro}</p>`;
  (d.sections||[]).forEach(sec=>{
    html += `<h3>${sec.title}</h3><p>${sec.body}</p>`;
  });
  if(d.skills && d.skills.length){
    html += `<h3>Ce dezvoltă</h3><ul class="skills">` +
            d.skills.map(s=>`<li>${s}</li>`).join("") + `</ul>`;
  }
  if(d.tips) html += `<p class="tip">💡 ${d.tips}</p>`;
  return html;
}

/* ===== Detectare automată a imaginilor numerotate =====
   Pornim de la imaginea dată (ex. .../23.jpg) și încercăm
   atât înainte cât și înapoi până nu mai găsim fișiere.
   Funcționează indiferent dacă numerotarea începe de la 1 sau alt număr. */

function parseImg(url){
  // separă: bază + număr + extensie  (ex: ".../folder/" "23" ".jpg")
  const m = url.match(/^(.*?)(\d+)(\.[a-zA-Z]+)(?:[?#].*)?$/);
  if(!m) return null;
  return { base:m[1], num:parseInt(m[2]), pad:m[2].length, ext:m[3] };
}
function buildUrl(p, n){
  const numStr = String(n).padStart(p.pad, "0");
  return p.base + numStr + p.ext;
}
function loadImage(url){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>res(true);
    im.onerror = ()=>res(false);
    im.src = encodeURI(url);
  });
}

async function detectImages(){
  const parsed = parseImg(data.img);
  // Dacă nu putem analiza URL-ul, afișăm doar imaginea dată
  if(!parsed){ return [data.img]; }

  const found = [];
  const maxProbe = 300; // siguranță

  // 1) confirmăm imaginea de start
  if(await loadImage(buildUrl(parsed, parsed.num))){
    found.push({n:parsed.num, url:buildUrl(parsed, parsed.num)});
  } else {
    // dacă nici imaginea dată nu există, întoarcem doar URL-ul brut
    return [data.img];
  }

  // 2) căutăm înapoi (numere mai mici), max 2 lipsuri consecutive
  let misses=0;
  for(let n=parsed.num-1; n>=parsed.num-maxProbe && n>=0; n--){
    const url=buildUrl(parsed,n);
    if(await loadImage(url)){ found.unshift({n, url}); misses=0; }
    else { misses++; if(misses>=2) break; }
  }
  // 3) căutăm înainte (numere mai mari), max 2 lipsuri consecutive
  misses=0;
  for(let n=parsed.num+1; n<=parsed.num+maxProbe; n++){
    const url=buildUrl(parsed,n);
    if(await loadImage(url)){ found.push({n, url}); misses=0; }
    else { misses++; if(misses>=2) break; }
  }
  // ordonăm crescător după număr și întoarcem doar URL-urile
  found.sort((a,b)=>a.n-b.n);
  return found.map(f=>f.url);
}

/* ===== Construire HTML cap pagină ===== */
function renderHead(){
  const grp = lvlGroup(data.level);
  const lvlColor = grp==="gradi" ? "var(--gradi)" : "var(--scoala)";
  const lvlIcon  = grp==="gradi" ? "🎈" : "🎒";
  const tags = data.themes.map(t=>
    `<span class="tag-pill" style="background:${THEME_BG[t]||'#eee'};color:${THEME_COLOR[t]||'#333'}">${ICONS[t]||''} ${THEME_NAME[t]||t}</span>`
  ).join("");

  return `
    <div class="fisa-head">
      ${data.level?`<span class="lvl-badge" style="background:${lvlColor}">${lvlIcon} ${LVL_NAME[data.level]||data.level}</span>`:''}
      <h1>${data.title}</h1>
      ${data.cat?`<span class="fisa-cat">${data.cat}</span>`:''}
      ${data.desc?`<p class="fisa-desc">${data.desc}</p>`:''}
      ${tags?`<div class="fisa-tags">${tags}</div>`:''}
    </div>`;
}

/* ===== Slider ===== */
let images = [];
let current = 0;

function renderSlider(){
  return `
    <div class="slider-wrap">
      <div class="stage">
        <div class="stage-inner" id="stage-inner">
          <span class="page-count" id="page-count"></span>
          <div class="loading" id="loading">
            <div class="spin"></div>
            <span>Se încarcă paginile…</span>
          </div>
          <button class="nav-arrow prev" id="btn-prev" aria-label="Pagina anterioară">‹</button>
          <button class="nav-arrow next" id="btn-next" aria-label="Pagina următoare">›</button>
        </div>
      </div>

      <p class="page-desc" id="page-desc"></p>

      <div class="slide-actions">
        <a class="btn btn-dl-page" id="btn-dl-page" download target="_blank">⬇️ Descarcă pagina</a>
        ${ data.pdf2
            ? `<a class="btn btn-dl-pdf" href="${data.pdf}" target="_blank">📥 PDF Partea 1</a>
               <a class="btn btn-dl-pdf" href="${data.pdf2}" target="_blank">📥 PDF Partea 2</a>`
            : (data.pdf?`<a class="btn btn-dl-pdf" href="${data.pdf}" target="_blank">📥 Descarcă PDF complet</a>`:'')
        }
      </div>

      <div class="thumbs" id="thumbs"></div>

      <div class="set-desc">
        ${setDescriptionHTML()}
      </div>
    </div>`;
}

function showSlide(i){
  if(i<0||i>=images.length) return;
  current = i;
  document.querySelectorAll("#stage-inner img").forEach((el,idx)=>el.classList.toggle("on", idx===i));
  document.getElementById("page-count").textContent = (i+1)+" / "+images.length;
  // descriere pagină
  const pd = document.getElementById("page-desc");
  const entry = pageDescs && pageDescs[i] ? pageDescs[i] : null;
  if(entry){
    if(typeof entry === "string"){
      pd.innerHTML = `<p>${entry}</p>`;
    } else {
      pd.innerHTML =
        (entry.title ? `<h3>${entry.title}</h3>` : "") +
        (entry.body  ? `<p>${entry.body}</p>` : "");
    }
    pd.style.display = "block";
  } else {
    pd.innerHTML = `<p>Pagina ${i+1} din ${images.length}</p>`;
    pd.style.display = "block";
  }
  document.getElementById("btn-prev").disabled = (i===0);
  document.getElementById("btn-next").disabled = (i===images.length-1);
  // buton descarcă pagina curentă
  const dl = document.getElementById("btn-dl-page");
  dl.href = encodeURI(images[i]);
  // thumbnails active
  document.querySelectorAll(".thumb").forEach((t,idx)=>t.classList.toggle("active", idx===i));
  // scroll thumbnail activ în vizor
  const at = document.querySelector(".thumb.active");
  if(at) at.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
}

function buildGallery(){
  const inner = document.getElementById("stage-inner");
  const loading = document.getElementById("loading");

  if(images.length===0){
    document.getElementById("content").innerHTML = `
      <div class="error-box">
        <div class="big">🔍</div>
        <h1 style="font-family:'Fredoka';font-size:26px;margin-bottom:8px">Nu am găsit imaginile</h1>
        <p>Nu am putut încărca paginile acestei fișe.</p>
        <p style="margin-top:14px"><a href="index.html">← Înapoi la materiale</a></p>
      </div>`;
    return;
  }

  // injectăm <img> pentru fiecare pagină
  const imgsHtml = images.map((url,idx)=>
    `<img src="${encodeURI(url)}" alt="${data.title} — pagina ${idx+1}" loading="${idx<2?'eager':'lazy'}">`
  ).join("");
  loading.insertAdjacentHTML("beforebegin", imgsHtml);
  loading.remove();

  // thumbnails
  document.getElementById("thumbs").innerHTML = images.map((url,idx)=>
    `<div class="thumb" data-i="${idx}"><img src="${encodeURI(url)}" alt="pagina ${idx+1}" loading="lazy"></div>`
  ).join("");
  document.querySelectorAll(".thumb").forEach(t=>
    t.addEventListener("click",()=>showSlide(parseInt(t.dataset.i)))
  );

  // butoane navigare
  document.getElementById("btn-prev").addEventListener("click",()=>showSlide(current-1));
  document.getElementById("btn-next").addEventListener("click",()=>showSlide(current+1));
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") showSlide(current-1);
    if(e.key==="ArrowRight") showSlide(current+1);
  });

  showSlide(0);
}

/* ===== Init ===== */
async function init(){
  if(!data.img){
    document.getElementById("content").innerHTML = `
      <div class="error-box">
        <div class="big">📄</div>
        <h1 style="font-family:'Fredoka';font-size:26px">Fișă inexistentă</h1>
        <p style="margin-top:10px"><a href="index.html">← Înapoi la materiale</a></p>
      </div>`;
    return;
  }
  document.getElementById("content").innerHTML = renderHead() + renderSlider();
  images = await detectImages();
  buildGallery();
}
init();
</script>
</body>
</html>
